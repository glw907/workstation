StylesPath = styles
MinAlertLevel = suggestion

Packages = Google, Microsoft
Vocab = House

# Comment-scoped linting: extract comment text and lint it as Markdown.
[formats]
go = md
ts = md
py = md

# Writing for a person: queue documents, the approval-packet models, and the
# docs/voice/ folder. The models speak as "I" and "we" and put a comma outside
# a quoted phrase, and their words can't change, so those three rules are off.
[{**/*.queue.md,**/skills/approval-packet/references/*.md,**/docs/voice/*.md}]
BasedOnStyles = Vale, Google
Google.FirstPerson = NO
Google.We = NO
Google.Quotes = NO
