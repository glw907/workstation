# Pavilion's RTL8821CE (rtw88_8821ce) wedges its firmware in deep power save: the
# kernel log fills with rtw_power_mode_change warnings and "failed to send h2c
# command", and every packet waits seconds on the card waking. Upstream's
# workaround (lkml, 2026-03, "Hard system freeze on RTL8821CE when power_save is
# enabled") is to keep the card out of deep LPS. Geoff, 2026-10-20.
options rtw88_core disable_lps_deep=Y
