# Keep the Bluetooth adapter awake (pavilion only, Geoff 2026-10-17). With USB
# autosuspend on, the Realtek adapter (0bda:b00e) sleeps after 2 s idle and has
# to wake before it answers the Keychron K3 paging it after keyboard sleep,
# which stretches the reconnect. Installed to /etc/modprobe.d/ from
# ~/.dotfiles/bluefin/etc/modprobe.d/ per the /etc drift discipline.
options btusb enable_autosuspend=0
