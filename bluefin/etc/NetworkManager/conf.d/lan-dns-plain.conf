# Let each link's DNS server fall back to plain DNS, so the router answers .lan names such
# as pavilion.lan (Geoff, 2026-11-24: "Fix .lan"). The router has no DNS-over-TLS, and the
# global DNSOverTLS=yes in resolved.conf.d/10-cloudflare-dns.conf made every .lan lookup
# fail. A tcpdump on 2026-11-24 showed only .lan names reach the router; other names still
# go to Cloudflare on port 853. NetworkManager sends 0 (no) as unset, so the link inherits
# the global yes; 1 (opportunistic) is the value that reaches resolved.
# 0 = no, 1 = opportunistic, 2 = yes, -1 = default.
[connection]
connection.dns-over-tls = 1
