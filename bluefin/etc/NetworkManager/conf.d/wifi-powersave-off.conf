# Keep 802.11 power save off on every Wi-Fi connection: pavilion is a desktop, and power
# save only adds wake-up latency to each packet. Added for the RTL8821CE (Geoff,
# 2026-10-20) and kept for the Intel AX210 that replaced it (2026-10-25).
# 2 = disable, 3 = enable, 0 = default.
[connection]
wifi.powersave = 2
