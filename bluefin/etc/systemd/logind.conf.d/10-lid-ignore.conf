# Never suspend on lid close (Geoff, 2026-09-12): unattended runs continue with the lid
# shut, on AC or battery, docked or not. Installed to /etc/systemd/logind.conf.d/ from
# ~/.dotfiles/bluefin/etc/systemd/logind.conf.d/ per the /etc drift discipline.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
