# Send every lookup to Cloudflare's resolvers over DNS-over-TLS instead of the router's DNS
# forwarder (Geoff, 2026-11-10: "The home router is a lousey place for a DNS lookup.").
# The router dropped about 1 lookup in 200 (447 timeouts in 87,007, resolvectl statistics),
# which failed cairn's clean-room setup runs. Domains=~. routes all names here ahead of
# each link's DNS; FallbackDNS stays the distribution default.
[Resolve]
DNS=1.1.1.1#cloudflare-dns.com 1.0.0.1#cloudflare-dns.com 2606:4700:4700::1111#cloudflare-dns.com 2606:4700:4700::1001#cloudflare-dns.com
DNSOverTLS=yes
Domains=~.
