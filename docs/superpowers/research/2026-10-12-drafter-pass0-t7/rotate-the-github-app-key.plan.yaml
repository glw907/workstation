constraints:
  - |
    Never say that a refused key produces `commit.failed` or `publish.failed` (f:bffsa9 is
    rejected), and never say what the editor or the publish shows when the token mint fails. The
    fact that states it, f:ogokfy, is outside this plan's fact list, so the published page's
    error-page paragraph in "Recover from a failed key" does not carry over.
  - |
    `/healthz` answers 200 when its check passes and 503 when it fails (f:paotzb). Never write that
    it answers 200 on a failure, as the published page does.
  - |
    Never quote an exact `/healthz` body as the expected response. State that a passing check
    answers 200 with `ok` true at the top level and in `checks.githubAppSigning`; a passing check
    carries more fields than this plan's facts state.
  - |
    Describe only the plain `/healthz` request. Never say that `/healthz` in general cannot prove
    that GitHub accepts the key, and never describe `?live=1`: its behavior rests on f:1pb077,
    which is outside this plan's fact list.
  - |
    Never say that `base64 -w 0` works on macOS (f:97fxdx is rejected). Never give a reason for the
    one-line form or say that a wrapped value fails to decode (f:w78j1b is rejected). Never say that
    an `Out-File` file matches the Node form's output (f:4sb2nh is rejected).
  - |
    Never claim how PowerShell encodes a string piped to a native command; no fact states it. The
    55-minute wait rests on f:vg42j3 alone.
  - |
    Never use the shell's hidden publish-all action as a signal, and never say when the Publish
    control is available or why step 4's edit is needed. Never say the edit goes live or deploys.
  - |
    Write the route as `/healthz` at the site root, never `/admin/healthz`.
  - |
    Placeholders: `path/to/new-key.pem` in the Node and GNU forms with no `~` inside the Node
    string, a full Windows path in the PowerShell form, and `<your-site>` for the address. Every
    command uses `npx wrangler`.
  - |
    `create-cairn-site` on first mention, in the introduction, then the setup command.
  - |
    Vendor specifics get a link, never a copy: GitHub's settings navigation, key limit, and PEM
    form; Cloudflare's Workers Logs interface and the gradual-deployments command.
  - |
    Every section opens on its `opens` sentence. Each step names its location before its action
    and holds one action; a procedure of one step is a single bulleted item. A reference names its
    target by heading, never by position. A step or task-section sentence stays at 26 words or
    fewer.
friction:
  - |
    The `introduction` mapping takes only prose, so the facts the claim inventory places in the
    introduction (f:ixr3ny, f:ejuoh6, f:kkp5bi, f:s90j7l, f:cjonmm) are named in `covers` prose,
    where `check-plan --facts` never resolves them. f:s90j7l and f:cjonmm appear nowhere else in
    the plan.
  - |
    A failure's `handledBy` must name an item, but the handler here is a whole section ("Recover
    from a failed key") or a choice between two subsections, so each failure points at one
    diagnostic step as a stand-in.
  - |
    The step `text` field mixes the reader's action with drafting notes (list numbers, "a single
    bulleted item"), since the format has no field for a step's presentation.
