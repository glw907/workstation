version: 1
page:
  path: docs/extend/rotate-the-github-app-key.md
  title: Rotate the GitHub App key
  type: task-guide
argument: |
  A GitHub App holds more than one private key at once, and a new key does not invalidate the
  old one (f:ixr3ny), so the page's spine is overlap: generate the new key beside the old, push
  it to the Worker, prove it, and only then delete the old key (f:ejuoh6). The overlap removes
  the outage, and it also leaves a rollback, which lasts exactly until the deletion (f:sszb7b,
  f:lg2ae8). Every section serves that order. Each verification signal is stated with what it
  proves and what it does not, because two of them can pass on a key GitHub would refuse: the
  plain `/healthz` request makes no network call (f:5dwnh1), and a publish inside the 55-minute
  token cache can run on a token the old key minted (f:vg42j3).

  This plan rewrites the markdown plan of 2026-10-07 in the YAML format and keeps its decisions,
  with three changes the facts force. `/healthz` answers 503, not 200, when its check fails
  (f:paotzb), so the drafter reads the status or the `ok` field and never repeats the published
  page's "200 even when the check fails". The expected `/healthz` body is no longer quoted
  exactly, since a passing check now carries fields outside this plan's facts. The published
  page's error-page paragraph in "Recover from a failed key" rests on `f:ogokfy`, which is
  outside this plan's fact list, so the drafter drops it and the earlier constraint returns.
introduction:
  covers: |
    The introduction is untitled text under the H1, two or three paragraphs, opening on a
    statement, never an imperative and never a sentence about the page. The framing record
    (`docs/internal/briefs/extend/rotate-the-github-app-key.framing.md`, "Intro plan") reasons its
    wording; this field fixes what it covers.

    Why the key gets replaced: a GitHub App's private key never expires, so the key a cairn site
    signs with stays in service until its developer replaces it (f:ixr3ny, f:s90j7l). The key's
    job: the Worker holds it as `GITHUB_APP_PRIVATE_KEY_B64` and signs with it to mint a
    short-lived installation token (f:i4fg3o, f:kkp5bi, scoped to that mechanism), the token every
    save and publish commits with (f:cjonmm). The occasions: GitHub names a key that may have been
    exposed (f:s90j7l), and an organization may rotate on its own schedule, which is the reader's
    reason and carries no product claim. Where the work happens: on GitHub, which holds the App's
    keys, and in Cloudflare, where `wrangler secret put` deploys the new key at once (f:zoekqt,
    f:86h9o6); the App ID and installation ID stay in the adapter, so no source file changes and
    no build runs (f:9xqudi, f:86h9o6).

    The two-key model and the order: an App can hold several keys at once and a new key does not
    invalidate the old one (f:ixr3ny), so the new key is generated beside the old one, pushed,
    and confirmed before the old key is deleted (f:ejuoh6). The contract, inside that framing: a
    developer who can edit the site's GitHub App and deploy its Worker replaces the App's private
    key without a publishing outage, proves the new key before the old one goes, and recovers if
    the new key fails. Until the deletion a failed new key can be rolled back (f:sszb7b); after
    it, the recovery is a third key (f:lg2ae8).

    What the order costs: proving the new key takes at least 55 minutes, because the Worker caches
    each installation token that long (f:vg42j3), and for an exposed key that window is the price
    of no outage (f:ixr3ny, f:s90j7l). A site that `create-cairn-site` created kept no copy of the
    old key outside the Worker, so on such a site a failed new key is recovered with a third key
    (f:kldwss, f:72yc97, f:lg2ae8). A reader whose key already fails is routed to "Recover from a
    failed key" by heading.
  priorKnowledge: |
    A terminal on the reader's platform, Wrangler's secret commands, and a Workers Logs query. The
    adapter's `createGithubApp` call is named once in "Push the new key to the Worker" and needs no
    prior knowledge here.
  notCovered: |
    Registering the App the first time belongs to
    `docs/extend/add-cairn-to-a-sveltekit-app.md#register-the-github-app`, or to the setup command
    for a scaffolded site. Why the key lives only as a Worker secret, and what the App's token can
    write, belong to `docs/extend/security-model.md#the-github-apps-reach`. The bounds sentence
    may name the page, since scope has no subject-first form.
orderReason: |
  Each section holds what the next one depends on. The two-key model and the order move into the
  introduction (cover 1), because without them "leave the old key in place" reads as an omission
  at step one. Before you begin names the access and the signals every later step reads, and it
  carries why a scaffolded site has no rollback copy before the deletion makes that matter.
  Generate comes first among the steps (cover 2), since nothing can be pushed before it exists
  and GitHub requires the new key before the old one can go (f:zoekqt). The outline's encode and
  push merge into one section (cover 3), since each platform's command encodes and pipes in one
  line, which also keeps the value out of the file where Windows PowerShell 5.1's UTF-16LE default
  bites (f:dbue4k). Verify precedes the deletion: the anatomy puts verification after the steps,
  but the last step here is irreversible (f:lg2ae8), and confirming before deleting is the page's
  safety property (f:ejuoh6). The token cache (cover 6) moves from last into Verify's opening,
  where it explains the wait before the publish; left last, it would reach the reader after the
  old key was gone. Cover 5 splits: Delete the old key follows the checks it depends on, and the
  recovery section, the Ghost exemplar's named recovery section, separates the rollback while the
  old key exists from the third key after it. See also closes the page, per the anatomy.
preconditions:
  - site-deployed
  - github-app-access
  - wrangler-signed-in
  - admin-sign-in
  - observability-on
  - healthz-route
  - old-key-file
sections:
  - heading: Before you begin
    opens: |
      The rotation needs a deployed site, access to its GitHub App, its Worker, and its admin, and
      the two signals the checks read.
    items:
      - id: bb-deployed
        kind: sentence
        mode: claim
        text: |
          A deployed site whose Worker holds the App's key as `GITHUB_APP_PRIVATE_KEY_B64`. The
          setup command creates the App and deploys the site in one run; a hand-built site
          reaches the same state through the tutorial's credentials step.
        facts: [f:i4fg3o, f:kldwss]
      - id: bb-fact-kldwss
        kind: fact
        fact: f:kldwss
        use: |
          The setup command creates the App and deploys the site in one run.
      - id: bb-link-credentials
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#store-the-apps-credentials
      - id: bb-github
        kind: sentence
        mode: claim
        text: |
          A GitHub account that can edit the App's settings, where its private keys are managed;
          link GitHub's page rather than copying its navigation.
        facts: [f:zoekqt]
      - id: bb-link-github-keys
        kind: link
        target: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/managing-private-keys-for-github-apps
      - id: bb-fact-9ug9mo
        kind: fact
        fact: f:9ug9mo
        use: |
          `npx wrangler login` signs Wrangler in to the Cloudflare account that holds the site's
          Worker. The deploy clause is not used.
      - id: bb-admin
        kind: sentence
        mode: claim
        text: |
          A sign-in to the deployed admin as an editor who can publish, since Verify's publish
          runs there and its log query reads a record only an editor's admin visit writes. The
          setup command writes its runner's owner row and opens a sign-in link; a hand-built
          site's first owner signs in as the tutorial's production check shows.
        facts: [f:jjava3, f:ln5ug0]
      - id: bb-fact-ln5ug0
        kind: fact
        fact: f:ln5ug0
        use: |
          The setup command writes the owner row and opens a sign-in link. Its install, build,
          and deploy clauses are not used.
      - id: bb-link-verify-production
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#verify-the-production-site
      - id: bb-fact-prb2os
        kind: fact
        fact: f:prb2os
        use: |
          Workers Logs records only with `observability.enabled` set to `true` in `wrangler.jsonc`;
          the scaffold sets it, and a hand-built site adds it.
      - id: bb-link-email-binding
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#add-the-email-sending-binding-and-name-the-origin
      - id: bb-healthz
        kind: sentence
        mode: claim
        text: |
          A `/healthz` route at the site root. The scaffold ships one; a hand-built site adds it
          from the `loadHealth` reference entry.
        facts: [f:paotzb]
      - id: bb-link-loadhealth
        kind: link
        target: ../reference/sveltekit.md#loadhealth
      - id: bb-fact-72yc97
        kind: fact
        fact: f:72yc97
        use: |
          For the rollback, the current key's `.pem` file, if you have it. A site the setup
          command created holds the key only in the Worker's secret store, so without a copy kept
          elsewhere the rollback is unavailable and the recovery is a third key. One sentence, no
          custody advice.
      - id: bb-handoff
        kind: handoff
        text: |
          With that access in place, the new key comes first.
  - heading: Generate a new key
    opens: |
      A new key joins the App beside the old one, so generating it changes nothing until the
      Worker starts using it.
    items:
      - id: s-generate
        kind: step
        text: |
          One step, a single bulleted item, location first: on the App's settings page on GitHub,
          generate a private key and download its `.pem` file, following GitHub's page.
        requires: [github-app-access]
        produces: [new-key-file]
      - id: g-link-github-keys
        kind: link
        target: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/managing-private-keys-for-github-apps
      - id: g-fact-zoekqt
        kind: fact
        fact: f:zoekqt
        use: |
          GitHub keeps only the public portion, so the download is the only copy of the new
          private key (the page's one Warning, placed at this step, holding no procedural step);
          with one key on the App, the new key comes before the old one can be deleted. The
          settings navigation, the 25-key limit, and the PKCS#1 form stay behind the GitHub link,
          per the register's vendor-specifics rule.
      - id: g-fact-ixr3ny
        kind: fact
        fact: f:ixr3ny
        use: |
          Leave the old key in place: it keeps the site publishing until "Delete the old key".
      - id: g-handoff
        kind: handoff
        text: |
          Next, the new key goes to the Worker.
  - heading: Push the new key to the Worker
    opens: |
      The Worker reads the key as one line of base64, so each command encodes the `.pem` file and
      pipes it to `wrangler secret put`.
    items:
      - id: p-fact-i4fg3o
        kind: fact
        fact: f:i4fg3o
        use: |
          `GITHUB_APP_PRIVATE_KEY_B64` is the PEM base64-encoded with no line breaks. State the
          form and give no reason for it.
      - id: s-push
        kind: step
        text: |
          One step, a single bulleted item: in the site's directory, run the command for your
          platform, replacing the path with the new `.pem` file's location. A complete sentence
          introduces three forms, each a short label line and a code block.
        requires: [new-key-file, wrangler-signed-in, site-deployed]
        produces: [new-key-deployed]
      - id: p-fact-olofdb
        kind: fact
        fact: f:olofdb
        use: |
          Linux or macOS, with Node:
          `node -e "process.stdout.write(require('fs').readFileSync('path/to/new-key.pem').toString('base64'))" | npx wrangler secret put GITHUB_APP_PRIVATE_KEY_B64`.
          One clause: this is the encoding the setup command writes.
      - id: p-fact-z97ilc
        kind: fact
        fact: f:z97ilc
        use: |
          Linux, with GNU `base64`:
          `base64 -w 0 path/to/new-key.pem | npx wrangler secret put GITHUB_APP_PRIVATE_KEY_B64`.
          One clause: `-w 0` turns off the default wrapping. Label it Linux only and say nothing
          of macOS here.
      - id: p-fact-dbue4k
        kind: fact
        fact: f:dbue4k
        use: |
          Windows, in PowerShell:
          `[Convert]::ToBase64String([IO.File]::ReadAllBytes('C:\path\to\new-key.pem')) | npx wrangler secret put GITHUB_APP_PRIVATE_KEY_B64`.
          `[Convert]::ToBase64String` returns unwrapped base64. In the paragraph after the block:
          saving the value with `Out-File` first writes UTF-16LE under Windows PowerShell 5.1,
          two bytes per character, while PowerShell 7 writes UTF-8 without a BOM, so the command
          pipes straight to Wrangler.
      - id: p-fact-86h9o6
        kind: fact
        fact: f:86h9o6
        use: |
          `wrangler secret put` creates a new Worker version and deploys it immediately, so no
          build or deploy follows. A site on gradual deployments uses `wrangler versions secret
          put`, behind Cloudflare's link; the rest of the page assumes `wrangler secret put`.
          Separately, one sentence of explanation, not a step: `wrangler dev` reads `.dev.vars`,
          never the deployed secret, so a key kept there needs the same replacement.
      - id: p-link-secrets
        kind: link
        target: https://developers.cloudflare.com/workers/configuration/secrets/
      - id: p-fact-9xqudi
        kind: fact
        fact: f:9xqudi
        use: |
          The App id and installation id are non-secret values in the adapter's
          `createGithubApp` call, so only the secret changes and no source edit follows.
      - id: p-handoff
        kind: handoff
        text: |
          The new key now needs proof before the old one goes.
  - heading: Verify the new key
    opens: |
      The `/healthz` check proves at once that the new key signs, and a publish after the token
      cache expires proves that GitHub accepts it.
    items:
      - id: v-fact-vg42j3
        kind: fact
        fact: f:vg42j3
        use: |
          The cache paragraph, tied to the task by its first clause: the Worker caches each
          installation token per isolate for 55 minutes and mints only on a miss; a warm isolate
          keeps a token minted with the old key until its entry expires, and a cold isolate mints
          from the current secret. A publish in the first 55 minutes can succeed without the new
          key reaching GitHub. Also backs step 2's wait.
      - id: v-reason-wait-costs
        kind: reason
        text: |
          The old key keeps working throughout (f:ixr3ny), so the wait delays the proof without
          interrupting publishing.
      - id: v-leadin
        kind: sentence
        mode: verbatim
        text: |
          To verify the new key, follow these steps:
      - id: s-healthz
        kind: step
        text: |
          1. In a terminal, request `/healthz` on the deployed site with
          `curl -i https://<your-site>/healthz`.
        requires: [new-key-deployed, healthz-route]
        produces: [signing-checked]
        canFail: true
      - id: v-fact-paotzb
        kind: fact
        fact: f:paotzb
        use: |
          Step 1's result: a passing check answers status 200 with `ok` true; a failing one
          answers 503 with `ok` false. Read the status or the `ok` field.
      - id: v-fact-5dwnh1
        kind: fact
        fact: f:5dwnh1
        use: |
          Step 1's result, continued: on the plain request, `ok: true` proves the secret decodes,
          imports, and signs; the check makes no network call, so it never proves that GitHub
          accepts the key.
      - id: x-healthz
        kind: failure
        from: s-healthz
        symptom: |
          `/healthz` answers 503 with `ok: false` and a `detail` string.
        cause: |
          The Worker holds no key, or a secret that does not import or sign (f:5dwnh1).
        handledBy: d-missing
      - id: s-wait
        kind: step
        text: |
          2. Wait 55 minutes from the push, so that every cached token was minted from the new
          key.
        requires: [signing-checked]
        produces: [cache-expired]
      - id: s-open-entry
        kind: step
        text: |
          3. In the deployed admin, signed in, open an entry. Opening the admin also runs the
          shell read that step 6 queries (f:jjava3).
        requires: [admin-sign-in, cache-expired]
        produces: [shell-read-run]
      - id: s-edit
        kind: step
        text: |
          4. In the editor, change a line you are ready to publish, since the next step
          publishes it.
        requires: [shell-read-run]
        produces: [pending-edit]
      - id: v-fact-9sk0at
        kind: fact
        fact: f:9sk0at
        use: |
          Steps 4 and 5: Publish saves first, so no separate save step follows; the note reads
          "Published. The live site is rebuilding." (verbatim), the result under step 5.
      - id: s-publish
        kind: step
        text: |
          5. In the editor, publish the edit. That completed publish from the deployed Worker is
          the confirmation (f:ejuoh6, its confirm clause).
        requires: [pending-edit]
        produces: [new-key-confirmed]
        canFail: true
      - id: v-fact-ejuoh6
        kind: fact
        fact: f:ejuoh6
        use: |
          A real publish from the deployed Worker confirms the new key.
      - id: x-publish
        kind: failure
        from: s-publish
        symptom: |
          The publish does not complete. Point to "Recover from a failed key" by heading and say
          nothing of what the failure shows.
        handledBy: d-refused
      - id: s-query-logs
        kind: step
        text: |
          6. In Workers Logs, query records whose `event` field is `github.unreachable`, over the
          time since the push.
        requires: [shell-read-run, observability-on]
        produces: [logs-checked]
        canFail: true
      - id: v-link-workers-logs
        kind: link
        target: https://developers.cloudflare.com/workers/observability/logs/workers-logs/
      - id: v-fact-jjava3
        kind: fact
        fact: f:jjava3
        use: |
          Step 6's result: no record with `scope: 'shell'` after the admin visit means the shell
          read used a token GitHub accepted.
      - id: v-proof-prb2os
        kind: sentence
        mode: claim
        text: |
          An empty result proves this only with observability on, since without it Workers Logs
          records nothing.
        facts: [f:prb2os]
      - id: x-shell-record
        kind: failure
        from: s-query-logs
        symptom: |
          A `github.unreachable` record with `scope: 'shell'` appears after the admin visit.
        handledBy: d-refused
      - id: v-fact-7u49xs
        kind: fact
        fact: f:7u49xs
        use: |
          One sentence after the list: `commit.failed` and `publish.failed` come only from the
          commit step, so they are not the query for a key GitHub refuses; the event's other two
          scopes are behind the log-events row.
      - id: v-link-log-events
        kind: link
        target: ../reference/log-events.md
      - id: v-handoff
        kind: handoff
        text: |
          With every check passed, the old key can go.
  - heading: Delete the old key
    opens: |
      Once every check passes, delete the old key on GitHub, and treat the deletion as final.
    items:
      - id: s-delete
        kind: step
        text: |
          One step, a single bulleted item, location first: on the App's settings page on GitHub,
          delete the old private key, following GitHub's page.
        requires: [signing-checked, new-key-confirmed, logs-checked]
        produces: [old-key-deleted]
      - id: d-link-github-keys
        kind: link
        target: https://docs.github.com/en/apps/creating-github-apps/authenticating-with-a-github-app/managing-private-keys-for-github-apps
      - id: d-fact-lg2ae8
        kind: fact
        fact: f:lg2ae8
        use: |
          GitHub cannot restore a deleted key, so from here on a failure of the new key is
          recovered by a third key, named by heading. No notice here; the Warning stays at the
          generate step.
  - heading: Recover from a failed key
    opens: |
      A failed key is rolled back while the old key and its file still exist, and replaced with a
      third key otherwise.
    items:
      - id: r-leadin
        kind: sentence
        mode: verbatim
        text: |
          To find which failure you have, check these in order:
      - id: d-missing
        kind: step
        text: |
          1. If `/healthz` reports the detail `GITHUB_APP_PRIVATE_KEY_B64 is not configured`, the
          Worker holds no key. In the site's directory, run the push again.
        requires: [new-key-file, wrangler-signed-in]
        produces: [new-key-deployed]
      - id: r-fact-9xqudi
        kind: fact
        fact: f:9xqudi
        use: |
          Check 1, the missing-key clause: a missing key throws `github.app-unreachable` on first
          token use.
      - id: d-unusable
        kind: step
        text: |
          2. If `/healthz` reports `key import or sign failed` or `malformed JWT`, the secret is
          not a usable private key. Check the path and any `Out-File` step, then push again.
        requires: [new-key-file, wrangler-signed-in]
        produces: [new-key-deployed]
      - id: r-fact-5dwnh1
        kind: fact
        fact: f:5dwnh1
        use: |
          Checks 1 and 2: the three `detail` strings a failing signing check reports.
      - id: r-fact-dbue4k
        kind: fact
        fact: f:dbue4k
        use: |
          Check 2: an `Out-File` step under Windows PowerShell 5.1 writes UTF-16LE.
      - id: d-refused
        kind: step
        text: |
          3. If `/healthz` reports `ok: true` but a `scope: 'shell'` record carries
          `Error: GitHub installation token failed: <status>`, GitHub refused the key. Roll back,
          or generate a third key.
        requires: [signing-checked]
        produces: [failure-diagnosed]
      - id: r-fact-jjava3
        kind: fact
        fact: f:jjava3
        use: |
          Check 3: the refused-key `error` string on the `scope: 'shell'` record.
      - id: r-link-debug
        kind: link
        target: debug-your-site.md#read-the-structured-logs
      - id: r-handoff
        kind: handoff
        text: |
          Which way back applies depends on the old key and its file.
  - heading: Roll back to the old key
    level: 3
    opens: |
      Until the old key is deleted, pushing its base64 with the same command restores signing with
      it immediately.
    items:
      - id: s-rollback
        kind: step
        text: |
          One step, a single bulleted item: in the site's directory, run the push command for your
          platform from "Push the new key to the Worker" with the old key's `.pem` file.
        requires: [old-key-file, wrangler-signed-in]
        produces: [old-key-restored]
      - id: rb-fact-sszb7b
        kind: fact
        fact: f:sszb7b
        use: |
          Re-pushing the undeleted old key's base64 with the same `wrangler secret put` restores
          signing with it immediately, so the site publishes on the old key while the new key is
          diagnosed (f:ejuoh6, its rollback clause).
      - id: rb-scaffold
        kind: sentence
        mode: claim
        text: |
          The rollback needs the old key's file, which a site the setup command created never
          kept.
        facts: [f:72yc97]
      - id: rb-handoff
        kind: handoff
        text: |
          Without the old key's file, follow Generate a third key.
  - heading: Generate a third key
    level: 3
    opens: |
      GitHub cannot restore a deleted key, so a failure after the deletion, or without the old
      key's file, is recovered by generating a third key.
    items:
      - id: t-fact-lg2ae8
        kind: fact
        fact: f:lg2ae8
        use: |
          After deletion there is no restore; generate a third key instead.
      - id: s3-generate
        kind: step
        text: |
          1. Generate another key, as in "Generate a new key".
        requires: [github-app-access]
        produces: [third-key-file]
      - id: s3-push
        kind: step
        text: |
          2. Push it, as in "Push the new key to the Worker".
        requires: [third-key-file, wrangler-signed-in]
        produces: [third-key-deployed]
      - id: s3-verify
        kind: step
        text: |
          3. Run the checks in "Verify the new key".
        requires: [third-key-deployed]
        produces: [third-key-confirmed]
      - id: s3-delete-failed
        kind: step
        text: |
          4. On the App's settings page on GitHub, delete the key that failed.
        requires: [third-key-confirmed]
        produces: [failed-key-deleted]
      - id: s3-delete-old
        kind: step
        text: |
          5. If the old key is still on the App, delete it there too.
        requires: [failed-key-deleted]
        produces: [old-key-deleted]
      - id: t-fact-zoekqt
        kind: fact
        fact: f:zoekqt
        use: |
          Steps 4 and 5: keys are removed only by hand.
  - heading: See also
    opens: |
      These pages cover what this guide leaves out.
    items:
      - id: sa-register
        kind: link
        target: add-cairn-to-a-sveltekit-app.md#register-the-github-app
      - id: sa-reach
        kind: link
        target: security-model.md#the-github-apps-reach
