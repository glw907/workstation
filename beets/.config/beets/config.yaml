# Workstation beets config for a local listening library in ~/Music.
# Mirrors dubplate's defaults (~/Projects/dubplate/config/beets-config.yaml):
# same layout, plugins, and quiet-mode behavior, repointed at ~/Music.
# Import workflow: download a purchase, then `beet import <dir>`.

directory: ~/Music
# Mutable state lives outside ~/.config so stow never folds it into the
# dotfiles repo on a fresh machine.
library: ~/.local/share/beets/library.db

import:
  move: yes
  write: yes
  # Under `beet import -q`, anything beets can't confidently tag is skipped
  # and left in place rather than guessed at.
  quiet_fallback: skip
  none_rec_action: skip
  timid: no
  # Group by album tags, not by directory, so a flat folder of loose
  # tracks from several albums still imports as separate albums.
  group_albums: yes

# Tag reissues and remasters by their original release year, so a 1993
# album that got remastered in 2015 still sorts as 1993.
original_date: yes
# Multi-disc albums number tracks per disc instead of one long run.
per_disc_numbering: yes

paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Singles/$artist - $title
  comp: Compilations/$album%aunique{}/$track $title

# musicbrainz must be listed explicitly: since beets 2.4 MusicBrainz is a
# metadata-source plugin, and an explicit plugins line without it leaves
# the autotagger with zero candidate sources (every album "Evaluating 0
# candidates", then skipped).
plugins: musicbrainz fetchart embedart replaygain

fetchart:
  auto: yes

replaygain:
  backend: ffmpeg

embedart:
  auto: yes
